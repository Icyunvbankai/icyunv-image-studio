<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICYUNV Image Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --panel:#141414; --panel2:#1c1c1c;
  --neon:#39ff14; --gold:#d4af37; --txt:#f2f2f2; --dim:#9a9a9a;
  --border:#2a2a2a; --danger:#ff3b3b;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--txt); font-family:'Inter',system-ui,sans-serif; min-height:100vh}
header{padding:28px 24px 18px; text-align:center; border-bottom:1px solid var(--border);
  background:radial-gradient(ellipse at 50% -40%, rgba(57,255,20,.12), transparent 60%)}
header h1{font-family:'Anton',sans-serif; font-size:clamp(28px,6vw,52px); letter-spacing:2px;
  background:linear-gradient(180deg,#fff 20%,var(--neon) 55%,#0d5c06 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent}
header p{color:var(--dim); margin-top:6px; font-size:14px}
header p b{color:var(--neon)}
.wrap{max-width:1200px; margin:0 auto; padding:24px; display:grid; grid-template-columns:380px 1fr; gap:24px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px}
.card h2{font-size:13px; text-transform:uppercase; letter-spacing:2px; color:var(--neon); margin-bottom:14px}
label.lbl{display:block; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:14px 0 6px}
textarea{width:100%; min-height:110px; background:var(--panel2); border:1px solid var(--border); border-radius:10px;
  color:var(--txt); padding:12px; font-size:15px; resize:vertical; font-family:inherit}
textarea:focus{outline:none; border-color:var(--neon)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{background:var(--panel2); border:1px solid var(--border); color:var(--txt); border-radius:999px;
  padding:7px 14px; font-size:13px; cursor:pointer; transition:.15s}
.chip:hover{border-color:var(--neon)}
.chip.on{background:var(--neon); color:#000; border-color:var(--neon); font-weight:700}
.row{display:flex; gap:10px}
.row>*{flex:1}
select,input[type=text]{width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:10px;
  color:var(--txt); padding:10px 12px; font-size:14px; font-family:inherit}
select:focus,input:focus{outline:none; border-color:var(--neon)}
.toggles{display:flex; gap:16px; margin-top:14px; flex-wrap:wrap}
.tgl{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--dim); cursor:pointer; user-select:none}
.tgl input{accent-color:var(--neon); width:16px; height:16px; cursor:pointer}
#genBtn{width:100%; margin-top:18px; padding:15px; font-family:'Anton',sans-serif; font-size:20px; letter-spacing:2px;
  background:linear-gradient(180deg,var(--neon),#1fae0a); color:#000; border:none; border-radius:12px; cursor:pointer; transition:.15s}
#genBtn:hover{filter:brightness(1.1)}
#genBtn:disabled{opacity:.5; cursor:wait}
.hint{font-size:12px; color:var(--dim); margin-top:10px; line-height:1.5}
#gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; align-content:start}
.gitem{background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; position:relative}
.gitem img{width:100%; display:block; aspect-ratio:1; object-fit:cover; background:#000}
.gitem .meta{padding:10px 12px}
.gitem .meta p{font-size:12px; color:var(--dim); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:32px}
.gitem .actions{display:flex; gap:8px; margin-top:8px}
.gitem .actions button{flex:1; padding:8px; font-size:12px; font-weight:700; border-radius:8px; cursor:pointer; border:1px solid var(--border);
  background:var(--panel2); color:var(--txt)}
.gitem .actions button:hover{border-color:var(--neon); color:var(--neon)}
.gitem .actions button.danger:hover{border-color:var(--danger); color:var(--danger)}
.loading{display:flex; flex-direction:column; align-items:center; justify-content:center; aspect-ratio:1; background:#000; gap:12px}
.spinner{width:44px; height:44px; border:4px solid var(--border); border-top-color:var(--neon); border-radius:50%; animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading small{color:var(--dim); font-size:12px}
.err{padding:20px; text-align:center; color:var(--danger); font-size:13px}
.empty{grid-column:1/-1; text-align:center; color:var(--dim); padding:60px 20px; border:1px dashed var(--border); border-radius:12px}
.empty b{color:var(--neon)}
footer{text-align:center; padding:24px; color:var(--dim); font-size:12px; border-top:1px solid var(--border); margin-top:12px}
footer a{color:var(--neon); text-decoration:none}
.viewer{position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:50; padding:20px}
.viewer.open{display:flex}
.viewer img{max-width:92vw; max-height:88vh; border-radius:10px; border:1px solid var(--border)}
.viewer .close{position:absolute; top:18px; right:24px; font-size:32px; color:#fff; cursor:pointer; background:none; border:none}
</style>
</head>
<body>
<header>
  <h1>ICYUNV IMAGE STUDIO</h1>
  <p>Your own generator. <b>Free. No signup. No blocked prompts.</b></p>
</header>
<div class="wrap">
  <div class="card">
    <h2>Create</h2>
    <label class="lbl">Prompt</label>
    <textarea id="prompt" placeholder="Describe the image... e.g. dripping graffiti letters spelling TOAD DAWG above a frosty cannabis bud, ICYUNV at the bottom, black background, tee graphic"></textarea>
    <label class="lbl">Style preset</label>
    <div class="chips" id="presets"></div>
    <div class="row">
      <div><label class="lbl">Model</label>
        <select id="model">
          <option value="flux">flux — best quality</option>
          <option value="turbo">turbo — fastest</option>
        </select></div>
      <div><label class="lbl">Size</label>
        <select id="size">
          <option value="1024x1024">Square 1:1</option>
          <option value="1024x1366">Portrait 3:4</option>
          <option value="1024x1536">Portrait 2:3</option>
          <option value="1536x1024">Landscape 3:2</option>
          <option value="1536x512">Wide 3:1</option>
          <option value="1024x1792">Tall 9:16</option>
          <option value="1792x1024">Wide 16:9</option>
        </select></div>
    </div>
    <div>
      <label class="lbl">Print size (t-shirt dimensions)</label>
      <select id="printsize">
        <option value="">Custom — use Size above</option>
        <option value="back">Back print 12&Prime;&times;16&Prime;</option>
        <option value="oversized">Oversized back 24&Prime;&times;36&Prime;</option>
        <option value="chest">Chest hit 5&Prime;&times;5&Prime;</option>
        <option value="allover">All-over 12&Prime;&times;12&Prime;</option>
        <option value="hem">Hem hit (wide strip)</option>
      </select>
      <div class="hint" id="printHint"></div>
    </div>
    <div class="toggles">
      <label class="tgl"><input type="checkbox" id="enhance"> Enhance prompt</label>
      <label class="tgl"><input type="checkbox" id="priv" checked> Private (hide from public feed)</label>
      <label class="tgl"><input type="checkbox" id="lockseed"> Lock seed</label>
    </div>
    <button id="genBtn">GENERATE</button>
    <p class="hint">Powered by Pollinations.ai — free, no account needed. Images generate in ~10–60 seconds. Private mode keeps them out of the public feed.</p>
  </div>
  <div>
    <div class="card" style="margin-bottom:16px; padding:14px 20px">
      <h2 style="margin:0">Gallery <span id="count" style="color:var(--dim)"></span></h2>
    </div>
    <div id="gallery"></div>
  </div>
</div>
<div class="viewer" id="viewer">
  <button class="close" id="vclose">&times;</button>
  <img id="vimg" alt="preview">
</div>
<footer>Built for ICYUNV &bull; Free forever via <a href="https://pollinations.ai" target="_blank" rel="noopener">pollinations.ai</a></footer>
<script>
const PRESETS = {
  "None": "",
  "Tee graphic": ", bold t-shirt graphic, flat vector screen-print style, solid black background, production-ready",
  "Graffiti": ", wildstyle graffiti art, dripping letters, spray paint texture, bold colors, street art",
  "Photoreal": ", photorealistic, 8k, highly detailed, cinematic lighting",
  "Dark fantasy": ", dark fantasy illustration, dramatic lighting, intricate detail, moody atmosphere",
  "Anime": ", anime style, vibrant, clean linework, studio quality",
  "Minimal logo": ", minimalist logo design, flat vector, high contrast, simple shapes",
  "Era Mashup × Iced": ", mashup of art historical periods in one composition — classical Roman relief sculpture colliding with Basquiat-style neo-expressionist marks, baroque drama, graffiti wildstyle — portrait of a figure wearing heavy iced-out diamond chains and a gold grill with vampire fangs, bold streetwear t-shirt graphic, centered composition framed for back print, high contrast, screen-print aesthetic"
};
const PRINT_SIZES = {
  "": null,
  "back":      { size:"1024x1366", label:"Back print — 12\u2033×16\u2033", dpi:"3600×4800 px @ 300 DPI" },
  "oversized": { size:"1024x1536", label:"Oversized back — 24\u2033×36\u2033", dpi:"7200×10800 px @ 300 DPI" },
  "chest":     { size:"1024x1024", label:"Chest hit — 5\u2033×5\u2033", dpi:"1500×1500 px @ 300 DPI" },
  "allover":   { size:"1024x1024", label:"All-over panel — 12\u2033×12\u2033", dpi:"3600×3600 px @ 300 DPI" },
  "hem":       { size:"1536x512",  label:"Hem hit — wide strip", dpi:"4500×1500 px @ 300 DPI" }
};
const $ = id => document.getElementById(id);
const presetsEl = $("presets");
let activePreset = "None";
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement("button");
  b.className = "chip" + (name === "None" ? " on" : "");
  b.textContent = name;
  b.onclick = () => {
    activePreset = name;
    [...presetsEl.children].forEach(c => c.classList.remove("on"));
    b.classList.add("on");
  };
  presetsEl.appendChild(b);
});
$("printsize").onchange = () => {
  const ps = PRINT_SIZES[$("printsize").value];
  if(ps){
    $("size").value = ps.size;
    $("printHint").textContent = ps.label + " · generate here, then upscale to " + ps.dpi + " for production print.";
  } else {
    $("printHint").textContent = "";
  }
};
let history = [];
try { history = JSON.parse(localStorage.getItem("icyunv-studio-history") || "[]"); } catch(e){}
function saveHistory(){ try{ localStorage.setItem("icyunv-studio-history", JSON.stringify(history.slice(0,60))); }catch(e){} }
function seedVal(){
  if($("lockseed").checked){
    let s = parseInt(localStorage.getItem("icyunv-studio-seed") || "0", 10);
    if(!s){ s = Math.floor(Math.random()*999999); localStorage.setItem("icyunv-studio-seed", s); }
    return s;
  }
  const s = Math.floor(Math.random()*999999);
  localStorage.setItem("icyunv-studio-seed", s);
  return s;
}
function render(){
  const g = $("gallery");
  g.innerHTML = "";
  $("count").textContent = history.length ? `(${history.length})` : "";
  if(!history.length){
    g.innerHTML = `<div class="empty">Nothing here yet.<br><b>Write a prompt and hit GENERATE.</b></div>`;
    return;
  }
  history.forEach((h,i) => {
    const d = document.createElement("div");
    d.className = "gitem";
    d.innerHTML = `<img loading="lazy" alt="">
      <div class="meta"><p></p>
      <div class="actions">
        <button data-a="view">View</button>
        <button data-a="dl">Download</button>
        <button data-a="del" class="danger">Delete</button>
      </div></div>`;
    const img = d.querySelector("img");
    img.src = h.url; img.alt = h.prompt;
    d.querySelector("p").textContent = h.prompt;
    d.querySelector('[data-a=view]').onclick = () => { $("vimg").src = h.url; $("viewer").classList.add("open"); };
    d.querySelector('[data-a=dl]').onclick = () => download(h);
    d.querySelector('[data-a=del]').onclick = () => { history.splice(i,1); saveHistory(); render(); };
    g.appendChild(d);
  });
}
async function download(h){
  try{
    const r = await fetch(h.url);
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "icyunv-" + Date.now() + ".jpg";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  }catch(e){ window.open(h.url, "_blank"); }
}
$("vclose").onclick = () => $("viewer").classList.remove("open");
$("viewer").onclick = e => { if(e.target.id === "viewer") $("viewer").classList.remove("open"); };
$("genBtn").onclick = () => {
  let p = $("prompt").value.trim();
  if(!p){ $("prompt").focus(); return; }
  p += PRESETS[activePreset];
  const [w,hgt] = $("size").value.split("x");
  const seed = seedVal();
  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(p) +
    `?model=${$("model").value}&width=${w}&height=${hgt}&seed=${seed}&nologo=true&private=${$("priv").checked}` +
    ($("enhance").checked ? "&enhance=true" : "");
  const btn = $("genBtn");
  btn.disabled = true; btn.textContent = "GENERATING...";
  const g = $("gallery");
  document.querySelector(".empty")?.remove();
  const d = document.createElement("div");
  d.className = "gitem";
  const t0 = Date.now();
  d.innerHTML = `<div class="loading"><div class="spinner"></div><small>cooking... <span>0</span>s</small></div>
    <div class="meta"><p></p></div>`;
  d.querySelector("p").textContent = $("prompt").value.trim();
  g.prepend(d);
  const timer = setInterval(()=>{ const s=d.querySelector(".loading small span"); if(s) s.textContent = Math.floor((Date.now()-t0)/1000); }, 500);
  const img = new Image();
  img.onload = () => {
    clearInterval(timer);
    history.unshift({prompt: $("prompt").value.trim(), url, ts: Date.now()});
    saveHistory(); render();
    btn.disabled = false; btn.textContent = "GENERATE";
  };
  img.onerror = () => {
    clearInterval(timer);
    d.innerHTML = `<div class="err">Generation failed — try again or simplify the prompt.</div>`;
    btn.disabled = false; btn.textContent = "GENERATE";
  };
  img.src = url;
};
render();
</script>
</body>
</html>
